<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Verbum Admin — Login</title>
  <link rel="stylesheet" href="/admin/css/style.css" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">V</div>
        <h1>Verbum Admin</h1>
        <p>Moderação de perguntas</p>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required />
        </div>
        <div class="error-text" id="login-erro"></div>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module" src="/admin/js/login.js"></script>
</body>
</html>
